# Render Blueprint Configuration (https://render.com/docs/blueprint-spec)
# Automatically provisions Vite Pill Web Service + Render Managed PostgreSQL

databases:
  - name: vite-pill-db
    databaseName: vite_pill
    user: vite_pill_user
    plan: free

services:
  - type: web
    name: vite-pill
    runtime: python
    plan: free
    buildCommand: apt-get install -y libzbar0 && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vite-pill-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
