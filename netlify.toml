[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = ["vite_pill/**"]

# Redirect web app routes to the serverless function handler
# serverless_wsgi preserves the original request path from the Lambda event

[[redirects]]
  from = "/scan"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/verify/*"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/admin-login"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/add"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/manufacturer/*"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/download/apk"
  to = "/.netlify/functions/app"
  status = 200
