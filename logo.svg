<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Soft background square -->
  <rect width="200" height="200" rx="40" fill="#f8f9fa"/>
  
  <!-- QR Scan Brackets (Dark Grey) -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  <path d="M 150 80 L 150 50 L 120 50" fill="none" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  <path d="M 50 120 L 50 150 L 80 150" fill="none" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  <path d="M 150 120 L 150 150 L 120 150" fill="none" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  
  <!-- The Pill Element -->
  <g transform="rotate(-45 100 100)">
    <!-- Defining the right half for clipping -->
    <clipPath id="right-half">
      <rect x="100" y="60" width="60" height="80" />
    </clipPath>
    
    <!-- Base Pill (Company Blue) -->
    <rect x="50" y="75" width="100" height="50" rx="25" fill="#0056b3" />
    
    <!-- Overlay Half Pill (Verification Green) -->
    <rect x="50" y="75" width="100" height="50" rx="25" fill="#28a745" clip-path="url(#right-half)" />
    
    <!-- White Dividing Line -->
    <line x1="100" y1="75" x2="100" y2="125" stroke="#ffffff" stroke-width="6" />
  </g>
</svg>
